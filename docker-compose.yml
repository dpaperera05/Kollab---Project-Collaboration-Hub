services:
  backend:
    build:
      context: ./app/backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - BACKEND_PORT=5000
    volumes:
      - ./app/backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./app/frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./app/frontend:/usr/src/app
      - /usr/src/app/node_modules